  model_path: models/farm-icons/best.onnx
  labels_path: models/farm-icons/labels.txt
  input_size: 960
  score_threshold: 0.6
  nms_threshold: 0.45
  device: cpu
  classes:
    watering:
      min_score: 0.6
    harvest:
      min_score: 0.6
    fishing:
      min_score: 0.6
    midwifery:
      min_score: 0.6
